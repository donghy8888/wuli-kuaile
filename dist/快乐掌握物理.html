<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f7cf6">
<title>快乐掌握物理 · 初中物理闯关</title>
<meta name="description" content="初中物理闯关小游戏：19 章闯关、物理实验室模拟、公式抢答、单位连连看、错题本">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
<style>
:root{
  --bg1:#e6f4ff; --bg2:#fff4e0; --ink:#2d3047; --muted:#7a7f9a;
  --pri:#2f7cf6; --pri2:#8ab8ff; --ok:#00b894; --bad:#ff5e57; --warn:#fdcb6e;
  --card:#ffffff; --back1:#2f7cf6; --back2:#00c2d1; --radius:14px;
  --shadow:0 4px 0 rgba(45,48,71,.15), 0 8px 18px rgba(45,48,71,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
sub{font-size:.62em;vertical-align:-.25em;line-height:0}
sup{font-size:.62em;vertical-align:.55em;line-height:0}
#app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;padding:0 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;justify-content:space-between;height:52px;padding-top:env(safe-area-inset-top)}
.brand{font-weight:800;font-size:20px;letter-spacing:1px;flex:1;text-align:center}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:var(--shadow);font-size:20px}
.icon-btn[hidden]{display:block;visibility:hidden}

.screen{display:none;flex-direction:column;flex:1}
.screen.active{display:flex}

/* ---------- 首页 ---------- */
.hero{text-align:center;margin:6px 0 12px}
.hero-title{font-size:34px;font-weight:900;color:var(--pri);text-shadow:3px 3px 0 #fff, 5px 5px 0 rgba(47,124,246,.2)}
.hero-title span{color:#ff8a3d;margin-left:4px;display:inline-block;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.06)}}
.hero-sub{color:var(--muted);margin-top:4px}
.card-panel{background:rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow);padding:12px}
.settings{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.set-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set-label{font-weight:700;font-size:14px;min-width:84px}
.seg{display:flex;background:#e8f1ff;border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 2px 0 #1d5fc9}
.menu{display:grid;grid-template-columns:1fr;gap:10px}
.game-tile{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:18px;background:#fff;box-shadow:var(--shadow);position:relative;transition:transform .1s}
.game-tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(45,48,71,.15)}
.gt-emoji{font-size:34px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.t1 .gt-emoji{background:#ffe0e6}.t2 .gt-emoji{background:#dff7ef}.t3 .gt-emoji{background:#fff3cf}.t4 .gt-emoji{background:#e5e9ff}.t5 .gt-emoji{background:#f0e4ff}
.gt-name{font-size:18px;font-weight:800}
.gt-desc{font-size:13px;color:var(--muted);margin-top:2px}
.gt-best{margin-left:auto;font-size:12px;font-weight:800;color:var(--pri);white-space:nowrap}
.soon{opacity:.55;box-shadow:none;border:2px dashed #c9c9e0;background:transparent}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:16px 6px 8px;line-height:1.5}
@media (min-width:520px){.menu{grid-template-columns:1fr 1fr}}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;position:relative}
.hud[hidden]{display:none}
.hud-item{background:#fff;border-radius:12px;box-shadow:var(--shadow);text-align:center;padding:4px 0 2px}
.hud-k{font-size:11px;color:var(--muted);font-weight:700}
.hud-v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
#hudCombo.hot{color:#ff7a00;animation:pop .3s}
.timer.low .hud-v{color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.timebar{grid-column:1/-1;height:6px;background:#fff;border-radius:6px;overflow:hidden}
#timebarFill{height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));background-size:300% 100%;transition:width .25s linear}

/* ---------- 周期表网格 ---------- */
.ptable-wrap{position:relative}
.ptable{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(6,auto);gap:3px}
.gtable{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.gtable.big{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:0}
.gtable:empty,.ptable:empty{display:none}
.cell{aspect-ratio:1/1.3;border-radius:7px;position:relative;perspective:400px;font-size:clamp(10px,3.4vw,16px)}
.cell .ci{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.cell .cf{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font-weight:800}
.cell .cb{background:linear-gradient(135deg,var(--back1),var(--back2));color:rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cell .cfr{background:#fff;transform:rotateY(180deg);box-shadow:0 2px 0 rgba(0,0,0,.12);line-height:1}
.cell.up .ci{transform:rotateY(180deg)}
.cell.cur .cfr{outline:3px solid #ff7aa8;outline-offset:1px;background:#fff6fa}
.cell.dead .ci{transform:rotateY(180deg)}
.cell.dead .cfr{background:#d7f8ec;color:#0a8f6d}
.cell.dead .cfr::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,94,87,.35);font-size:1.7em}
.cell.noble .cb{background:repeating-linear-gradient(45deg,#d8dbe8,#d8dbe8 4px,#e8eaf3 4px,#e8eaf3 8px);color:#9aa0b8}
.cell.missed{animation:shake .4s}
.cell .lbl{white-space:nowrap}
.gtable .cell{aspect-ratio:1/1;font-size:clamp(9px,2.8vw,14px)}
.gtable.big .cell{aspect-ratio:1.3/1;font-size:20px}
.cell.hit{animation:hitShake .35s}
@keyframes hitShake{0%,100%{transform:none}25%{transform:translate(-2px,1px) rotate(-6deg)}75%{transform:translate(2px,-1px) rotate(6deg)}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

/* 特效层 */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:30}
.bullet{position:fixed;width:6px;height:22px;border-radius:3px;background:linear-gradient(#fff6a0,#ff9f1a);box-shadow:0 0 10px #ffb400;transform-origin:center}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none}
.boom-ring{position:fixed;width:20px;height:20px;border-radius:50%;border:4px solid #ffb400;transform:translate(-50%,-50%);animation:ring .5s ease-out forwards}
@keyframes ring{to{width:110px;height:110px;opacity:0;border-width:1px}}
.kill-tag{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:22px;color:#ff3d71;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;animation:killUp .9s ease-out forwards;white-space:nowrap}
@keyframes killUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.flash{position:fixed;inset:0;background:#fff;opacity:.0;animation:flash .25s}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}

/* 大牌 + 提示 */
.qzone{display:flex;gap:12px;align-items:center;margin:12px 0 10px}
.bigcard{width:112px;height:132px;flex:none;perspective:700px}
.bc-inner{width:100%;height:100%;position:relative;transition:transform .45s cubic-bezier(.3,1.4,.6,1);transform-style:preserve-3d}
.bigcard.up .bc-inner{transform:rotateY(180deg)}
.bc-face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.bc-back{background:linear-gradient(135deg,var(--back1),var(--back2));color:#fff;font-size:56px;font-weight:900}
.bc-front{background:#fff;transform:rotateY(180deg);border:3px solid #ff7aa8}
.bc-z{position:absolute;top:6px;left:10px;font-size:13px;color:var(--muted);font-weight:700}
.bc-sym{font-size:46px;font-weight:900;line-height:1.05}
.bc-sym.grp{font-size:34px}
.bc-name{font-size:18px;font-weight:700;margin-top:2px}
.bc-badge{position:absolute;top:6px;right:6px;background:var(--warn);font-size:11px;font-weight:800;padding:1px 6px;border-radius:8px}
.bc-badge[hidden]{display:none}
.bigcard.killed .bc-front{border-color:var(--ok);background:#effff9}
.bigcard.killed{animation:pop .3s}
.bigcard.wrong .bc-front{border-color:var(--bad);background:#fff4f4}
.bigcard.wrong{animation:shake .4s}
.qside{flex:1;min-width:0}
.qprompt{font-size:17px;font-weight:800}
.feedback{margin-top:6px;font-size:14px;min-height:62px;line-height:1.45}
.feedback .ok{color:var(--ok);font-weight:900;font-size:18px}
.feedback .bad{color:var(--bad);font-weight:900;font-size:18px}
.feedback .vals{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.vchip{display:inline-block;padding:1px 7px;border-radius:8px;background:#e8f1ff;color:var(--pri);font-weight:800;font-size:14px}
.vchip.picked{background:var(--ok);color:#fff}
.feedback .note{color:var(--muted);font-size:12px;display:block;margin-top:2px}

/* 键盘 */
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:auto}
.key{height:54px;border-radius:14px;font-size:22px;font-weight:900;background:#fff;box-shadow:0 4px 0 #c7c9e0;transition:transform .06s}
.key.pos{color:#e8505b}
.key.neg{color:#2f80ed;background:#eef6ff;box-shadow:0 4px 0 #b9d4f5}
.key:active,.key.press{transform:translateY(4px);box-shadow:0 0 0 #c7c9e0}
.key:disabled{opacity:.5}
.keypad.armneg .key.neg{outline:3px solid #2f80ed}
.kb-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
@media (hover:none){.kb-hint{display:none}}
.crosshair{position:fixed;bottom:-60px;left:50%;font-size:30px;pointer-events:none;transition:transform .12s;z-index:31;display:none}

/* ---------- 连连看 ---------- */
.match-tip{text-align:center;font-size:13px;color:var(--muted);margin:2px 0 10px}
.match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{height:76px;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-weight:900;display:grid;place-items:center;transition:transform .12s, opacity .3s}
.mtile.sym{font-size:28px;color:var(--pri)}
.mtile.nm{font-size:22px;color:#e8505b;background:#fffaf0}
.mtile.sel{transform:scale(1.06);outline:4px solid #ff8a3d}
.mtile.gone{opacity:0;transform:scale(.3) rotate(20deg);pointer-events:none}
.mtile.no{animation:shake .4s;outline:4px solid var(--bad)}
@media (min-width:520px){.match-grid{grid-template-columns:repeat(4,1fr)}}

/* ---------- 化学式 ---------- */
.f-question{text-align:center}
.f-title{font-weight:800;font-size:16px}
.f-ions{display:flex;justify-content:center;align-items:center;gap:16px;margin:12px 0 6px;font-size:40px;font-weight:900}
.ion{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.ion .iv{font-size:18px;color:#e8505b;margin-bottom:4px}
.ion .iv.n{color:#2f80ed}
.ion .in{font-size:13px;color:var(--muted);margin-top:6px;font-weight:700}
.f-plus{font-size:28px;color:var(--muted)}
.f-hint{font-size:12px;color:var(--muted)}
.f-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fopt{height:74px;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:28px;font-weight:900}
.fopt.right{background:var(--ok);color:#fff}
.fopt.wrongpick{background:var(--bad);color:#fff;animation:shake .4s}
.f-feedback{text-align:center;margin-top:14px;font-size:16px;min-height:48px;font-weight:700}

/* ---------- 错题本 / 口诀 ---------- */
.wb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:18px;flex-wrap:wrap}
.wb-head small{font-size:12px;color:var(--muted)}
.wb-actions{display:flex;gap:8px}
.wb-list,.cheat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px;padding-bottom:20px}
.wb-item{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;gap:10px;align-items:center}
.wb-sym{font-size:26px;font-weight:900;min-width:56px;text-align:center;color:var(--pri)}
.wb-info{font-size:13px;line-height:1.5}
.wb-info b{font-size:15px}
.wb-cnt{color:var(--bad);font-size:12px;font-weight:700}
.wb-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
.poem p{margin:4px 0;font-size:16px;font-weight:700;text-align:center}
.poem .poem2{color:var(--pri);margin-top:10px}
.cheat-list .wb-item.noble{opacity:.6}

.btn{padding:11px 16px;border-radius:14px;font-weight:800;font-size:15px;background:#fff;box-shadow:0 3px 0 #c7c9e0}
.btn.primary{background:var(--pri);color:#fff;box-shadow:0 3px 0 #1d5fc9}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn:active{transform:translateY(3px);box-shadow:none}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(45,48,71,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:22px;width:min(100%,420px);max-height:90dvh;overflow:auto;padding:18px;text-align:center;animation:pop .35s}
.m-title{font-size:26px;font-weight:900;color:var(--pri)}
.m-record{margin-top:6px;font-size:18px;font-weight:900;color:#ff7a00;animation:pulse .6s infinite alternate}
.m-record[hidden]{display:none}
.m-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.m-stat{background:#eef5ff;border-radius:12px;padding:8px 2px}
.m-stat b{display:block;font-size:22px}
.m-stat span{font-size:12px;color:var(--muted)}
.m-miss{text-align:left;font-size:14px}
.m-miss h4{margin:6px 0}
.m-miss .mrow{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px dashed #e3e4ef}
.m-btns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(45,48,71,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.countdown{position:fixed;inset:0;display:grid;place-items:center;font-size:110px;font-weight:900;color:var(--pri);text-shadow:4px 4px 0 #fff;z-index:40;background:rgba(255,255,255,.35);pointer-events:none}
.countdown[hidden]{display:none}
.countdown span{animation:pop .5s}
</style>
<style>
/* 快乐掌握物理 · 专属样式（与化学背背背同一套设计语言） */
.t6 .gt-emoji{background:#d9f5ff}.t7 .gt-emoji{background:#ffe8d6}
.new-badge{font-size:10px;background:#ff3d71;color:#fff;border-radius:8px;padding:1px 6px;vertical-align:3px}
.muted{color:var(--muted);font-size:13px}
.okc{color:var(--ok)} .badc{color:var(--bad)}
.shake{animation:shake .4s}
.lab-hero{text-align:center;margin:4px 0 12px}
.lab-hero-t{font-size:30px;font-weight:900;color:#00a3c4;text-shadow:3px 3px 0 #fff}
.lab-hero-t.map-t{color:var(--pri)}
.lab-hero-s{color:var(--muted);font-size:14px}
.sec-h{margin:16px 2px 8px;font-size:16px;font-weight:900}

/* 首页数据条 */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.ss{background:#fff;border-radius:14px;box-shadow:var(--shadow);text-align:center;padding:7px 2px 5px}
.ss b{display:block;font-size:20px;font-weight:900;color:var(--pri);font-variant-numeric:tabular-nums}
.ss span{font-size:11px;color:var(--muted);font-weight:700}

/* 章节地图 */
.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.map-tile{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:transform .1s}
.map-tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(45,48,71,.15)}
.mt-no{position:absolute;top:5px;left:8px;font-size:11px;font-weight:900;color:var(--muted)}
.mt-emoji{font-size:28px;line-height:1.2}
.mt-name{font-size:14px;font-weight:800;text-align:center;line-height:1.25}
.mt-stars{font-size:14px;color:#d5d8e6;letter-spacing:1px}
.map-tile.some .mt-stars,.map-tile.full .mt-stars{color:#ffb400}
.map-tile.full{background:linear-gradient(160deg,#fffbe8,#fff)}
@media (min-width:520px){.map-grid{grid-template-columns:repeat(4,1fr)}}

/* 章节详情 */
.ch-head{display:flex;gap:12px;align-items:center}
.ch-emoji{font-size:40px;width:64px;height:64px;border-radius:18px;background:#e8f1ff;display:grid;place-items:center;flex:none}
.ch-no{font-size:12px;color:var(--muted);font-weight:700}
.ch-name{font-size:22px;font-weight:900}
.ch-stars{font-size:13px;color:var(--muted)}
.ch-stars .st{color:#ffb400;font-size:16px;letter-spacing:1px}
.kp-list{display:flex;flex-direction:column;gap:6px}
.kp{display:flex;gap:10px;background:#fff;border-radius:14px;box-shadow:0 2px 0 rgba(45,48,71,.08);padding:9px 12px;font-size:14.5px;line-height:1.6}
.kp b{color:var(--pri)}
.kp-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;margin-top:2px}
.fc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fcard{background:linear-gradient(160deg,#fff,#f3f8ff);border:2px solid #d6e6ff;border-radius:14px;padding:8px 10px}
.fc-n{font-size:12px;font-weight:800;color:var(--muted)}
.fc-f{font-size:18px;font-weight:900;color:#1d5fc9;margin:2px 0;font-family:"Times New Roman","Noto Serif CJK SC",serif;font-style:italic;line-height:1.3}
.fc-u{font-size:11.5px;color:#5c6380;line-height:1.4}
.fcard.sm .fc-f{font-size:15px}
.ch-actions{display:flex;gap:10px;justify-content:center;margin:18px 0 24px;flex-wrap:wrap}
.ch-actions .btn[hidden]{display:none}
.btn.big{font-size:18px;padding:14px 26px}
.btn.mini{padding:4px 10px;font-size:13px}
.cards-ch{margin-bottom:10px}
.cc-h{font-weight:800;margin:6px 2px}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.uchip{background:#fff;border-radius:12px;box-shadow:0 2px 0 #d7d9ea;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.uchip b{color:#e8505b}

/* 答题 */
.q-card{padding:14px 14px 16px}
.q-card.in{animation:pop .35s}
.q-tag{font-size:12px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.qt-type{background:#e8f1ff;color:var(--pri);border-radius:8px;padding:1px 8px}
.q-text{font-size:19px;font-weight:900;margin-top:8px;line-height:1.5}
.q-text .fx,.opt .fx{font-family:"Times New Roman",serif;font-style:italic;color:#1d5fc9}
.ph-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ph-opts.tf{flex-direction:row}
.ph-opts.tf .opt{flex:1;text-align:center;font-size:18px;padding:16px 8px}
.opt{text-align:left;padding:12px 14px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #c7c9e0;font-size:15.5px;font-weight:700;line-height:1.45;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.right{background:var(--ok);color:#fff;box-shadow:0 3px 0 #00896d}
.opt.wrongpick{background:var(--bad);color:#fff;animation:shake .4s}
.opt:disabled{opacity:1}
.opt:disabled:not(.right):not(.wrongpick){opacity:.55}
.ph-note{margin-top:10px;font-size:14.5px;line-height:1.6;min-height:24px;background:rgba(255,255,255,.75);border-radius:12px;padding:0 10px}
.ph-note:empty{background:none}
.ph-note:not(:empty){padding:8px 12px}
.ph-note b{color:var(--pri)} .ph-note .okc{color:var(--ok)} .ph-note .badc{color:var(--bad)}
.ph-next{margin:12px auto 0;display:block;min-width:60%}
.ph-next[hidden]{display:none}
.num-wrap{margin-top:12px}
.num-wrap[hidden]{display:none}
.num-show{display:flex;align-items:baseline;justify-content:center;gap:8px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:10px;margin-bottom:10px}
.num-val{font-size:32px;font-weight:900;min-width:90px;text-align:center;border-bottom:3px dashed var(--pri2);font-variant-numeric:tabular-nums}
.num-val.empty{color:#c9cde0}
.num-val.ok{color:var(--ok);border-color:var(--ok)} .num-val.bad{color:var(--bad);border-color:var(--bad);animation:shake .4s}
.num-unit{font-size:20px;font-weight:800;color:var(--muted)}
.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.numpad .key{height:50px;color:var(--ink)}
.numpad .w2{grid-column:span 2}
.numpad .go{background:var(--pri);color:#fff;box-shadow:0 4px 0 #1d5fc9;font-size:18px}

/* 连连看 */
.mtile.long{font-size:17px}
.mtile.nm{font-size:20px}

/* 结算星星 */
.m-stars{font-size:46px;letter-spacing:6px;margin-top:4px}
.m-stars[hidden]{display:none}
.m-stars span{color:#e3e5ef;display:inline-block}
.m-stars span.on{color:#ffb400;animation:starIn .5s both;text-shadow:0 3px 0 #e09a00}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.m-miss .lab-mrow{gap:8px;font-size:13px}
.lab-mrow span{flex:1.4} .lab-mrow b{flex:1;font-weight:700;color:#0a8f6d;text-align:right}
.m-btns .btn[hidden]{display:none}

/* 错题本 */
.wb-lab-list{padding:12px 0 24px}
.wb-lab{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.55;position:relative}
.wb-kind{position:absolute;right:10px;top:8px;font-size:11px;font-weight:800;background:#e3f0ff;color:#1d5fc9;border-radius:8px;padding:1px 6px}
.wb-q{font-weight:800;padding-right:70px}
.wb-a{color:#0a8f6d;font-weight:700}
.wb-ex{color:#5c6380;font-size:13px}
.wb-actions{flex-wrap:wrap}
.wb-actions .btn[hidden]{display:none}

/* 实验室 */
.sim-task{padding:10px 12px}
.sim-task.pop{animation:pop .4s}
.tk-dots{display:flex;gap:5px;margin-bottom:6px}
.td{width:22px;height:6px;border-radius:4px;background:#e1e4f0}
.td.on{background:var(--ok)} .td.cur{background:var(--warn)}
.tk-t{font-size:15.5px;font-weight:800;line-height:1.5}
.tk-t b{color:#e8505b}
.tk-h{font-size:13px;color:var(--muted);margin-top:4px}
.tk-h summary{cursor:pointer;font-weight:700}
.sim-stage{margin-top:10px;padding:6px;overflow:hidden}
.sim-svg{width:100%;height:auto;display:block;border-radius:12px}
.sim-svg .st{font-size:11px;font-weight:700;fill:#2d3047;font-family:inherit}
.sim-svg .st.m{fill:#7a7f9a;font-size:10.5px}
.sim-svg .st.b{font-weight:900;font-size:13px}
.sim-svg .st.big{font-size:17px}
.sim-svg .st.r{fill:#e8505b} .sim-svg .st.o{fill:#e08600} .sim-svg .st.bl{fill:#2f7cf6} .sim-svg .st.ok{fill:#00a37a} .sim-svg .st.w{fill:#fff}
.flow{animation:flow 1s linear infinite}
@keyframes flow{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
.sim-read{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.sr{background:#fff;border-radius:12px;box-shadow:0 2px 0 #d7d9ea;padding:6px 4px;text-align:center}
.sr span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sr b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.sr.r b{color:#e8505b} .sr.o b{color:#e08600} .sr.bl b{color:#2f7cf6} .sr.ok b{color:#00a37a}
.sim-ctrl{display:flex;flex-direction:column;gap:10px;margin-top:12px;background:rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow);padding:12px}
.sc-row{display:flex;flex-direction:column;gap:6px}
.sc-row.step{flex-direction:row;align-items:center;justify-content:space-between}
.sc-l{font-size:14px;font-weight:800;display:flex;justify-content:space-between}
.sc-l b{color:var(--pri)}
.sc-row .seg button{font-size:13px}
input[type=range]{width:100%;height:30px;accent-color:var(--pri)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #c7c9e0;font-size:22px;font-weight:900;color:var(--pri)}
.stepper button:active{transform:translateY(3px);box-shadow:none}
.stepper b{min-width:62px;text-align:center;font-size:16px}
.sim-tips{margin:12px 0 24px;font-size:14px;line-height:1.6;background:#fff7dd;border-radius:14px;padding:10px 12px}
.sim-tips small{color:var(--muted)}
.toast{left:0;right:0;margin:0 auto;width:max-content;transform:translateY(20px)}
.toast.show{transform:translateY(0)}
html,body{overflow-x:hidden}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="icon-btn" id="btnHome" aria-label="返回" hidden>🏠</button>
    <div class="brand" id="brand">⚛️ 快乐掌握物理</div>

  <!-- 首页 -->

        </div>
      </div>
      <div class="set-row">
        <span class="set-label">📚 题目范围</span>
        <div class="seg" id="segScope">
          <button data-v="all">全部</button><button data-v="8a">八上</button><button data-v="8b">八下</button><button data-v="9">九年级</button>
        </div>
      </div>
    </div>

    <div class="menu" id="menu">
      <button class="game-tile t1" data-game="map">
        <div class="gt-emoji">🗺️</div>
        <div class="gt-body"><div class="gt-name">章节闯关</div><div class="gt-desc">19 章知识点卡 + 闯关题，答得好拿 3 颗星</div></div>
        <div class="gt-best" id="mapBest"></div>
      </button>
      <button class="game-tile t6" data-game="lab">
        <div class="gt-emoji">🔬</div>
        <div class="gt-body"><div class="gt-name">物理实验室 <span class="new-badge">NEW</span></div><div class="gt-desc">拖一拖、调一调：光的反射折射、凸透镜、杠杆、浮力、欧姆定律</div></div>
        <div class="gt-best" id="labBest"></div>
      </button>
      <button class="game-tile t3" data-game="rush">
        <div class="gt-emoji">⚡</div>
        <div class="gt-body"><div class="gt-name">公式抢答</div><div class="gt-desc">公式、单位、常数换算，限时快答</div></div>
        <div class="gt-best" data-best="rush"></div>
      </button>
      <button class="game-tile t2" data-game="match">
        <div class="gt-emoji">🔗</div>
        <div class="gt-body"><div class="gt-name">单位连连看</div><div class="gt-desc">物理量 ↔ 单位，限时配对</div></div>
        <div class="gt-best" data-best="match"></div>
      </button>
      <button class="game-tile t7" data-game="blitz">
        <div class="gt-emoji">⏱️</div>
        <div class="gt-body"><div class="gt-name">限时大乱斗</div><div class="gt-desc">所选范围内的题目随机出，比比谁答得多</div></div>
        <div class="gt-best" data-best="blitz"></div>
      </button>
      <button class="game-tile t4" data-game="wrongbook">
        <div class="gt-emoji">📒</div>
        <div class="gt-body"><div class="gt-name">错题本</div><div class="gt-desc">答错的题自动收进来，练对就移除</div></div>
        <div class="gt-best" id="wbCount"></div>
      </button>
      <button class="game-tile t5" data-game="cards">
        <div class="gt-emoji">📜</div>
        <div class="gt-body"><div class="gt-name">公式卡片</div><div class="gt-desc">全部公式和单位一页看完</div></div>
      </button>

    <footer class="foot">按人教版初中物理章节编写 · 进度保存在本机浏览器里 · 计算题按题目给的 g 值计算</footer>
  </section>

  <!-- 共用 HUD -->
  <div class="hud" id="hud" hidden>
    <div class="hud-item"><div class="hud-k">得分</div><div class="hud-v" id="hudScore">0</div></div>
    <div class="hud-item"><div class="hud-k">连击</div><div class="hud-v" id="hudCombo">0</div></div>
    <div class="hud-item timer"><div class="hud-k" id="hudTimeK">时间</div><div class="hud-v" id="hudTime">60</div></div>
    <div class="timebar"><div id="timebarFill"></div></div>
  </div>

  <!-- 章节地图 -->
  <section class="screen" id="scrMap">
    <div class="lab-hero"><div class="lab-hero-t map-t">🗺️ 章节闯关</div><div class="lab-hero-s">每章先看知识卡，再闯关；正确率越高星星越多</div></div>
    <div id="mapList"></div>
  </section>

  <!-- 章节详情：知识卡 -->
  <section class="screen" id="scrChapter">
    <div class="ch-head card-panel">

      <div class="ch-info"><div class="ch-no" id="chNo"></div><div class="ch-name" id="chName"></div><div class="ch-stars" id="chStars"></div></div>
    </div>
    <h3 class="sec-h">📌 知识要点</h3>
    <div class="kp-list" id="chPoints"></div>
    <h3 class="sec-h" id="chFormH">🧮 公式与单位</h3>
    <div class="fc-list" id="chForms"></div>
    <div class="ch-actions">
      <button class="btn primary big" id="btnChStart">🚀 开始闯关</button>
      <button class="btn" id="btnChSim" hidden>🔬 去做实验</button>

  <!-- 答题（闯关 / 大乱斗 / 抢答 / 错题练习共用） -->

  <!-- 单位连连看 -->

  <!-- 实验室菜单 -->

    <div class="menu" id="labMenu"></div>
    <footer class="foot">模拟中的数据取 g = 10 N/kg；示意图不按真实比例。</footer>

</div>
<script>
/* 快乐掌握物理 —— 题库与知识卡（初中物理，人教版章节顺序）
 * 题目写法：
 *   C(题干, [正确项, 干扰项...], 解析)      单选（显示时自动打乱）
 *   T(题干, true/false, 解析)               判断
 *   N(题干, 答案数字, '单位', 解析)          计算填空（屏幕数字键盘）
 * 解析里可以写 HTML。g 未说明时按题干取值。
 */
(function () {
  const C = (q, opts, ex) => ({ t: 'c', q, opts, ex });
  const T = (q, ans, ex) => ({ t: 'tf', q, ans, ex });
  const N = (q, ans, unit, ex) => ({ t: 'n', q, ans, unit, ex });

  const CHAPTERS = [
  /* ===================== 八年级上 ===================== */
  { id: 'move', grade: '8a', emoji: '🚗', name: '机械运动',
    points: ['长度国际单位是米（m）：1 km = 1000 m，1 m = 10 dm = 100 cm = 1000 mm。',
      '刻度尺读数要<b>估读到分度值的下一位</b>。',
      '<b>误差</b>不可避免，只能减小（多次测量取平均值、用精密仪器）；<b>错误</b>可以避免。',
      '判断运动还是静止要先选<b>参照物</b>；运动和静止是<b>相对</b>的。',
      '速度表示运动快慢：<b>1 m/s = 3.6 km/h</b>。',
      '匀速直线运动：速度大小和方向都不变；平均速度 = 总路程 ÷ 总时间。'],
    formulas: [{ n: '速度', f: 'v = s / t', u: 'v：m/s　s：m　t：s' }],
    sim: null,
    qs: [
      C('坐在行驶的列车上，乘客说自己是静止的，他选择的参照物是', ['乘坐的车厢', '路边的树', '站台', '迎面驶来的列车'], '乘客相对于车厢的位置没有改变，所以以车厢为参照物他是静止的。'),
      C('1 m/s 等于多少 km/h？', ['3.6 km/h', '36 km/h', '0.36 km/h', '1000 km/h'], '1 m/s = 1 m ÷ 1 s = 0.001 km ÷ (1/3600 h) = 3.6 km/h。'),
      N('小明百米赛跑用时 12.5 s，他的平均速度是多少？', 8, 'm/s', 'v = s / t = 100 m ÷ 12.5 s = 8 m/s。'),
      T('误差和错误一样，都可以避免。', false, '误差只能<b>减小</b>，不能消除；错误是由于不遵守规则造成的，可以避免。'),
      C('用分度值为 1 mm 的刻度尺测量物体长度，下列记录正确的是', ['2.35 cm', '2.3 cm', '2.350 cm', '23 mm'], '分度值 1 mm，要估读到 0.1 mm：2.35 cm = 23.5 mm，最后一位“5”是估读值。'),
      C('下列物体中，速度最大的是', ['奔跑的羚羊 25 m/s', '行驶的汽车 72 km/h', '百米运动员 10 m/s', '骑行的自行车 18 km/h'], '统一单位：72 km/h = 20 m/s，18 km/h = 5 m/s，所以羚羊 25 m/s 最快。'),
      N('汽车以 20 m/s 的速度匀速行驶 3 min，通过的路程是多少？', 3600, 'm', 's = vt = 20 m/s × 180 s = 3600 m。注意 3 min = 180 s。'),
      C('“两岸青山相对出，孤帆一片日边来”中，“青山相对出”选择的参照物是', ['船', '青山', '河岸', '太阳'], '以船为参照物，青山的位置在变化，所以青山是“运动”的。'),
      C('关于匀速直线运动，下列说法正确的是', ['速度大小和方向都不变', '路程越长，速度越大', '时间越短，速度越大', '速度与路程成正比'], '匀速直线运动的速度是一个定值，与路程和时间无关。'),
      C('测量长度时，多次测量取平均值的目的是', ['减小误差', '消除误差', '避免错误', '方便记录'], '多次测量求平均值可以<b>减小</b>误差，但不能消除误差。'),
      N('一列长 200 m 的火车以 20 m/s 的速度完全通过长 1000 m 的大桥，需要多少时间？', 60, 's', '完全通过的路程 = 桥长 + 车长 = 1200 m，t = s / v = 1200 m ÷ 20 m/s = 60 s。'),
    ] },
  { id: 'sound', grade: '8a', emoji: '🔔', name: '声现象',
    points: ['声音是由物体的<b>振动</b>产生的，振动停止，发声停止。',
      '声音的传播需要介质，<b>真空不能传声</b>；一般 v固 > v液 > v气，15 ℃ 空气中声速约 <b>340 m/s</b>。',

/* WebAudio 合成音效，无需音频文件 */
window.SFX = (function () {
  let ctx = null;
  let muted = localStorage.getItem('wl_muted') === '1';
  function ac() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, delay = 0) {
    if (muted) return;
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.3, filterFreq = 1200, delay = 0, endFreq = 100) {
    if (muted) return;
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(filterFreq, t);
    f.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
  }
  return {
    unlock() { ac(); },
    get muted() { return muted; },
    toggle() { muted = !muted; localStorage.setItem('wl_muted', muted ? '1' : '0'); return muted; },
    shoot() { noise(0.12, 0.35, 6000, 0, 800); tone(900, 0.12, 'square', 0.08, 120); },
    boom(combo = 0) {
      noise(0.5, 0.5, 2500, 0.08, 60);
      tone(110, 0.4, 'sine', 0.35, 40, 0.08);
      const base = 520 * Math.pow(1.06, Math.min(combo, 12));
      tone(base, 0.12, 'triangle', 0.12, null, 0.12);
      tone(base * 1.5, 0.15, 'triangle', 0.1, null, 0.2);
    },
    wrong() { tone(200, 0.25, 'sawtooth', 0.12, 110); tone(150, 0.3, 'square', 0.06, 90, 0.08); },
    flip() { tone(700, 0.06, 'sine', 0.08, 1100); },
    tap() { tone(600, 0.04, 'sine', 0.06); },
    ding(combo = 0) { const b = 660 * Math.pow(1.06, Math.min(combo, 12)); tone(b, 0.15, 'triangle', 0.15); tone(b * 1.26, 0.2, 'triangle', 0.12, null, 0.08); },
    tick() { tone(1000, 0.05, 'square', 0.05); },
    go() { tone(880, 0.25, 'triangle', 0.18); },
    end() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.15, null, i * 0.12)); },
    bubble() { for (let i = 0; i < 6; i++) tone(300 + Math.random() * 500, 0.06, 'sine', 0.07, 900 + Math.random() * 600, i * 0.09); },
    whoosh() { noise(0.35, 0.25, 3000, 0, 300); tone(300, 0.3, 'triangle', 0.08, 700); },
    fizz() { noise(0.4, 0.18, 8000, 0, 2000); },
    pop() { noise(0.08, 0.4, 4000, 0, 400); tone(500, 0.1, 'sine', 0.12, 150); },
    clear() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.15, 'triangle', 0.12, null, i * 0.07)); },
  };

  function Timer(seconds, onEnd) {
    let end = 0, total = seconds * 1000, iv = null, lastSec = null;
    const draw = () => {
      const left = Math.max(0, end - performance.now());
      const sec = Math.ceil(left / 1000);
      $('#hudTime').textContent = sec;
      $('#timebarFill').style.width = (left / total * 100) + '%';
      $('#timebarFill').style.backgroundPosition = (100 - left / total * 100) + '% 0';
      $('.hud .timer').classList.toggle('low', sec <= 10);
      if (sec !== lastSec && sec <= 5 && sec > 0) SFX.tick();

    this.bonus = s => { end += s * 1000; total = Math.max(total, end - performance.now()); draw(); };

  /* =========================================================

  function genRush() {
    const fs = FORMULAS.filter(f => inScope(f.g));
    const us = UNITS.filter(u => inScope(u.g));
    const facts = FACTS.filter(f => inScope(f.g));
    const r = Math.random();
    const others = (f, key) => shuffle(FORMULAS.filter(o => o.id !== f.id && !(f.excl || []).includes(o.id) && o[key] !== f[key])).map(o => o[key]);
    if (r < 0.32 && fs.length) {
      const f = rand(fs);
      return { t: 'c', id: 'rf-' + f.id, ch: 'rush', tag: '🧮 公式', q: `「${f.name}」的公式是？`, opts: [f.f, ...others(f, 'f').slice(0, 3)], ex: `${f.name}：<b>${f.f}</b>${f.unit ? '，结果单位 ' + f.unit : ''}` };
    }
    if (r < 0.55 && fs.length) {
      const f = rand(fs);
      return { t: 'c', id: 'rn-' + f.id, ch: 'rush', tag: '🧮 公式', q: `公式 <span class="fx">${f.f}</span> 是？`, opts: [f.name, ...others(f, 'name').slice(0, 3)], ex: `<b>${f.f}</b> 是${f.name}的公式。` };
    }
    if (r < 0.8 && us.length) {
      const u = rand(us);
      const wrong = shuffle(UNITS.filter(o => o.u !== u.u)).slice(0, 3).map(o => o.u);
      return { t: 'c', id: 'ru-' + u.q, ch: 'rush', tag: '📏 单位', q: `「${u.q}」的国际单位（或常用单位）是？`, opts: [u.u, ...wrong], ex: `${u.q}的单位是 <b>${u.u}</b>。` };
    }
    const f = rand(facts.length ? facts : FACTS);
    return Object.assign({ tag: '🔢 常数与换算' }, f);
  }

  function QuizGame(opts) {

    if (timed) timer = new Timer(settings.time, () => end());
    const n = list.length;

    function render() {
      if (mode === 'rush') { let q; do { q = genRush(); } while (cur && q.id === cur.id); cur = q; }
      else { if (i >= list.length) { if (mode === 'blitz') { list = shuffle(list); i = 0; } else return end(); } cur = list[i]; }

      $('#qText').innerHTML = cur.q;
      $('#qCard').classList.remove('in'); void $('#qCard').offsetWidth; $('#qCard').classList.add('in');
      $('#qNote').innerHTML = ''; $('#qNext').hidden = true;
      const box = $('#qOpts'); box.innerHTML = '';
      $('#numWrap').hidden = cur.t !== 'n';

        numStr = ''; drawNum(); $('#numUnit').textContent = cur.unit;
        $$('#numpad .key').forEach(k => (k.disabled = false));
      } else {
        const items = cur.t === 'tf'
          ? [{ html: '✔ 正确', ok: cur.ans === true, v: true }, { html: '✘ 错误', ok: cur.ans === false, v: false }]
          : shuffle(cur.opts.map((o, k) => ({ html: o, ok: k === 0 })));
        box.classList.toggle('tf', cur.t === 'tf');
        items.forEach(o => {
          const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = o.html; b._o = o;

    function drawNum() { const v = $('#numVal'); v.textContent = numStr || '?'; v.classList.toggle('empty', !numStr); v.classList.remove('ok', 'bad'); }
    function pick(b) {

    function key(k) {

      } else if (!busy && /^[1-4]$/.test(e.key)) { const b = $$('#qOpts .opt')[+e.key - 1]; if (b) pick(b); }
      else if (busy && (e.key === 'Enter' || e.key === ' ') && !$('#qNext').hidden) $('#qNext').click();
    };
    function judge(ok) {
      record(ok);
      const corr = cur.t === 'c' ? '' : cur.t === 'tf' ? '' : `正确答案：<b>${cur.ans} ${cur.unit}</b>　`;
      if (ok) {

        $('#qNote').innerHTML = `<b class="okc">✔ 正确！</b>${mode === 'practice' ? '（已移出错题本）' : ''} ${cur.ex}`;
      } else {

      if (mode === 'level') {

        const nx = CHAPTERS[ch.no];
        finish({ title: sN ? `🎉 第${ch.no}章 闯关成功！` : '💪 差一点，再来一次！', key: 'lv:' + ch.id, stats: st, misses, starN: sN,
          again: () => startQuiz({ mode: 'level', ch: ch.id }), next: nx ? () => openChapter(nx.id) : null });

  function MatchGame() {
    let running = false, sel = null, right = 0, wrong = 0, boards = 0;
    const timer = new Timer(settings.time, () => end());
    let pool = UNITS.filter(u => inScope(u.g)); if (pool.length < 6) pool = UNITS;
    function deal() {
      const pairs = shuffle(pool).slice(0, 6);
      const tiles = shuffle(pairs.flatMap((p, k) => [{ id: p.q, kind: 'q', txt: p.q }, { id: p.q, kind: 'u', txt: p.u }]));
      const g = $('#matchGrid'); g.innerHTML = '';
      tiles.forEach(t => {
        const b = document.createElement('button');
        b.className = 'mtile ' + (t.kind === 'q' ? 'nm' : 'sym') + (t.txt.length > 5 ? ' long' : '');
        b.dataset.id = t.id; b.dataset.kind = t.kind; b.textContent = t.txt;
        b.addEventListener('click', () => tap(b));
        g.appendChild(b);
      });
      sel = null;
    }
    function tap(b) {
      if (!running || b.classList.contains('gone')) return;
      SFX.unlock();
      if (!sel) { sel = b; b.classList.add('sel'); SFX.tap(); return; }
      if (sel === b) { b.classList.remove('sel'); sel = null; return; }
      if (sel.dataset.kind === b.dataset.kind) { sel.classList.remove('sel'); sel = b; b.classList.add('sel'); SFX.tap(); return; }
      const a = sel; sel = null; a.classList.remove('sel');
      if (a.dataset.id === b.dataset.id) {
        right++; record(true); hud.add(10); SFX.ding(hud.combo);
        a.classList.add('gone'); b.classList.add('gone');
        if (!$$('.mtile:not(.gone)').length) { boards++; timer.bonus(5); SFX.clear(); toast('🎉 清空一版！+5 秒'); setTimeout(() => running && deal(), 400); }
      } else {
        wrong++; record(false); hud.miss(); SFX.wrong();
        [a, b].forEach(x => { x.classList.add('no'); setTimeout(() => x.classList.remove('no'), 450); });
      }
    }
    function end() {
      if (!running) return; running = false; timer.stop();
      finish({ title: '⏰ 时间到！', key: 'match', stats: [['配对', right], ['配错', wrong], ['清空', boards + ' 版']], misses: [], again: () => startGame('match') });
      $('#mMiss').innerHTML = '';
    }
    this.start = () => { hud.reset(); timer.preview(); $('#matchGrid').innerHTML = ''; countdown(() => { running = true; timer.start(); deal(); }); };
    this.stop = () => { running = false; timer.stop(); };

  }

    view = opts.mode === 'level' ? 'level' : opts.mode === 'practice' ? 'practice' : 'game';
    if (opts.mode === 'level') viewArg = opts.ch;
    const titles = { rush: '⚡ 公式抢答', blitz: '⏱️ 限时大乱斗', practice: '📒 错题练习' };
    setBrand(opts.mode === 'level' ? `${CH[opts.ch].emoji} 第${CH[opts.ch].no}章 闯关` : titles[opts.mode]);
    show('scrQuiz');
    current = new QuizGame(opts); window.WL.game = current; current.start();
  }
  function startGame(name) {
    stopAll(); $('#modal').hidden = true; SFX.unlock();
    if (name === 'map') { view = 'map'; renderMap(); setBrand('🗺️ 章节闯关'); return show('scrMap'); }
    if (name === 'wrongbook') return openWrong();
    if (name === 'cards') { view = 'cards'; renderCards(); setBrand('📜 公式卡片'); return show('scrCards'); }
    if (name === 'lab') return window.WL.openLab();
    if (name === 'rush' || name === 'blitz') return startQuiz({ mode: name });
    if (name === 'match') { view = 'game'; setBrand('🔗 单位连连看'); show('scrMatch'); current = new MatchGame(); window.WL.game = current; current.start(); }
  }
  function back() {
    $('#modal').hidden = true;
    if (view === 'chapter') return startGame('map');
    if (view === 'level') return openChapter(viewArg);
    if (view === 'practice') return openWrong();
    if (view === 'sim') return window.WL.simBack();
    goHome();
  }

  $('#menu').addEventListener('click', e => { const t = e.target.closest('[data-game]'); if (t) startGame(t.dataset.game); });
  $('#segTime').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.time = +b.dataset.v; store.set('wl_settings', settings); SFX.tap(); refreshMenu(); });
  $('#segScope').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.scope = b.dataset.v; store.set('wl_settings', settings); SFX.tap(); refreshMenu(); });
  $('#btnHome').addEventListener('click', back);
  $('#btnToHome').addEventListener('click', back);
  $('#btnToWrong').addEventListener('click', openWrong);
  $('#btnWbPractice').addEventListener('click', () => startQuiz({ mode: 'practice' }));
  $('#btnWbClear').addEventListener('click', () => { if (confirm('确定清空错题本吗？')) { wrongBook = {}; saveWrong(); renderWrong(); } });
  const muteBtn = $('#btnMute');
  const drawMute = () => (muteBtn.textContent = SFX.muted ? '🔇' : '🔊');
  muteBtn.addEventListener('click', () => { SFX.toggle(); drawMute(); SFX.tap(); });
  document.addEventListener('keydown', e => { if (current && current.onKey && $('#modal').hidden) current.onKey(e); });

  window.WL = {
    data: window.PHY, startGame, startQuiz, openChapter, goHome,
    core: { $, $$, rand, shuffle, store, toast, show, setBrand, stopAll, record, refreshMenu, setView(v) { view = v; } },
  };
  drawMute();
  refreshMenu();
})();
</script>
<script>
/* 快乐掌握物理 · 🔬 物理实验室：可交互模拟 + 小任务 */
(function () {
  'use strict';
  const W = window.WL, C = W.core, { $, $$, store, toast } = C;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const R2D = 180 / Math.PI, D2R = Math.PI / 180;
  const f1 = x => (Math.round(x * 10) / 10).toString();
  const f2 = x => (Math.round(x * 100) / 100).toFixed(2);
  const arrowDefs = `<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8505b"/></marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f1a"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7cf6"/></marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00a37a"/></marker>
  </defs>`;
  const ray = (x1, y1, x2, y2, col, mk, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2.6" stroke-linecap="round" ${mk ? `marker-end="url(#${mk})"` : ''} ${extra}/>`;
  const txt = (x, y, s, cls = '', anchor = 'middle') => `<text x="${x}" y="${y}" class="st ${cls}" text-anchor="${anchor}">${s}</text>`;

  /* =========================================================
   * 1. 光的反射与折射
   * ========================================================= */
  const MED = { water: { n: 1.33, name: '水', fill: '#bfe3ff' }, glass: { n: 1.5, name: '玻璃', fill: '#cdeee3' } };
  const light = {
    id: 'light', emoji: '🌈', name: '光的反射与折射', ch: 'light', cls: 't1',
    desc: '调入射角，看反射角、折射角怎么变',
    init: () => ({ i: 30, med: 'water' }),
    ctrls: [
      { type: 'range', key: 'i', label: '入射角 i', min: 0, max: 80, step: 1, fmt: v => v + '°' },
      { type: 'seg', key: 'med', label: '下方介质', opts: [['water', '💧 水'], ['glass', '🔷 玻璃']] },
    ],
    calc(s) { const n = MED[s.med].n; const r = Math.asin(Math.sin(s.i * D2R) / n) * R2D; return { r }; },
    draw(s) {
      const { r } = this.calc(s), O = [150, 112], L = 108, i = s.i * D2R, rr = r * D2R, R = 30;
      const P = [O[0] - L * Math.sin(i), O[1] - L * Math.cos(i)];
      const Rf = [O[0] + L * Math.sin(i), O[1] - L * Math.cos(i)];
      const Rr = [O[0] + L * Math.sin(rr), O[1] + L * Math.cos(rr)];
      const arc = (a, up, right, col) => {
        if (a < 1) return '';
        const sy = up ? -1 : 1, ex = O[0] + (right ? 1 : -1) * R * Math.sin(a * D2R), ey = O[1] + sy * R * Math.cos(a * D2R);
        const sweep = up ? (right ? 1 : 0) : (right ? 0 : 1);
        return `<path d="M${O[0]},${O[1] + sy * R} A${R},${R} 0 0 ${sweep} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${col}" stroke-width="2"/>`;
      };
      const lab = (a, up, right, s2, col) => { const m = (a / 2) * D2R, d = R + 13; return a < 1 ? '' : `<text x="${O[0] + (right ? 1 : -1) * d * Math.sin(m)}" y="${O[1] + (up ? -1 : 1) * d * Math.cos(m) + 4}" class="st b" fill="${col}" text-anchor="middle">${s2}</text>`; };
      return `<svg viewBox="0 0 300 228" class="sim-svg">${arrowDefs}
        <rect x="0" y="0" width="300" height="112" fill="#f3f9ff"/>
        <rect x="0" y="112" width="300" height="116" fill="${MED[s.med].fill}"/>
        ${txt(8, 18, '空气', 'm', 'start')}${txt(8, 220, MED[s.med].name, 'm', 'start')}
        <line x1="0" y1="112" x2="300" y2="112" stroke="#5b6b8c" stroke-width="2"/>
        <line x1="150" y1="6" x2="150" y2="222" stroke="#7a7f9a" stroke-width="1.5" stroke-dasharray="6 5"/>
        ${txt(158, 16, '法线', 'm', 'start')}
        ${ray(P[0], P[1], O[0], O[1], '#e8505b', 'ahR')}
        ${ray(O[0], O[1], Rf[0], Rf[1], '#ff9f1a', 'ahO')}
        ${ray(O[0], O[1], Rr[0], Rr[1], '#2f7cf6', 'ahB')}
        ${arc(s.i, true, false, '#e8505b')}${arc(s.i, true, true, '#ff9f1a')}${arc(r, false, true, '#2f7cf6')}
        ${lab(s.i, true, false, 'i', '#e8505b')}${lab(s.i, true, true, "i'", '#ff9f1a')}${lab(r, false, true, 'r', '#2f7cf6')}
        <circle cx="150" cy="112" r="3.5" fill="#2d3047"/>
        ${txt(P[0] + (s.i > 50 ? 6 : -4), P[1] + (s.i > 50 ? -6 : 14), '入射光线', 'r', s.i > 50 ? 'start' : 'end')}
        ${txt(Rf[0] + (s.i > 50 ? -6 : 4), Rf[1] + (s.i > 50 ? -6 : 14), '反射光线', 'o', s.i > 50 ? 'end' : 'start')}
        ${txt(Math.min(Rr[0] + 6, 292), Rr[1] - 4, '折射光线', 'bl', Rr[0] > 230 ? 'end' : 'start')}
      </svg>`;
    },
    read(s) {
      const { r } = this.calc(s);
      return [['入射角 i', s.i + '°', 'r'], ['反射角 i′', s.i + '°', 'o'], ['折射角 r', f1(r) + '°', 'bl']];
    },
    tip(s) {
      const { r } = this.calc(s);
      if (s.i === 0) return '光<b>垂直</b>射入时，传播方向不改变（入射角、反射角、折射角都是 0°）。';
      return `反射角 = 入射角 = ${s.i}°；光从空气斜射入${MED[s.med].name}，折射角 ${f1(r)}° <b>小于</b>入射角。入射角增大，折射角也增大。`;
    },
    tasks: [
      { t: '让反射光线与入射光线<b>互相垂直</b>', hint: '两条光线的夹角 = 入射角 + 反射角 = 2i', check: s => s.i === 45 },
      { t: '让光<b>垂直</b>射入水面，观察折射光线', hint: '垂直入射时，入射角是多少度？', check: s => s.i === 0 && s.med === 'water' },
      { t: '换成<b>玻璃</b>，让折射角约为 <b>30°</b>（±1°）', hint: '折射角比入射角小，所以入射角要大于 30°', check: (s, me) => s.med === 'glass' && Math.abs(me.calc(s).r - 30) <= 1 },
    ],
  };

  /* =========================================================
   * 2. 凸透镜成像规律
   * ========================================================= */
  const lensImg = u => {
    const f = 10;
    if (u === f) return { none: true, kind: '不成像', use: '光线平行射出（可获得平行光）' };
    const v = u * f / (u - f), m = Math.abs(v / u);
    if (v < 0) return { v, m, real: false, kind: '正立、放大的虚像', use: '🔍 放大镜' };
    const size = u > 2 * f ? '缩小' : u === 2 * f ? '等大' : '放大';
    const use = u > 2 * f ? '📷 照相机' : u === 2 * f ? '📏 测焦距（u = v = 2f）' : '📽️ 投影仪';
    return { v, m, real: true, size, kind: `倒立、${size}的实像`, use };
  };
  const lens = {
    id: 'lens', emoji: '🔍', name: '凸透镜成像', ch: 'lens', cls: 't3',
    desc: '移动蜡烛，看像的倒正、大小、虚实（f = 10 cm）',
    init: () => ({ u: 15 }),
    ctrls: [{ type: 'range', key: 'u', label: '物距 u', min: 4, max: 45, step: 1, fmt: v => v + ' cm' }],
    draw(s) {
      const k = 3.4, X = 170, Y = 104, h = 30, f = 10, u = s.u;
      const x0 = X - u * k, ty = Y - h, im = lensImg(u);
      let rays = '', img = '', note = '';
      const ext = (x1, y1, x2, y2, toX) => { const t = (toX - x1) / (x2 - x1); return [toX, y1 + (y2 - y1) * t]; };
      if (im.none) {
        const e1 = ext(X, ty, X + f * k, Y, 340);
        rays = ray(x0, ty, X, ty, '#ff9f1a') + ray(X, ty, e1[0], e1[1], '#ff9f1a') + ray(x0, ty, 340, Y + (Y - ty) * (340 - X) / (X - x0) , '#00a37a');
        note = txt(255, 30, '折射光平行，不成像', 'm');
      } else {
        const xi = X + im.v * k, hi = h * im.m, yi = im.real ? Y + hi : Y - hi;
        if (im.real) {
          const e1 = ext(X, ty, xi, yi, 340), e2 = ext(x0, ty, xi, yi, 340);
          rays = ray(x0, ty, X, ty, '#ff9f1a') + ray(X, ty, e1[0], e1[1], '#ff9f1a') + ray(x0, ty, e2[0], e2[1], '#00a37a');
          if (xi < 336) img = `<line x1="${xi}" y1="${Y}" x2="${xi}" y2="${yi}" stroke="#e8505b" stroke-width="4" marker-end="url(#ahR)"/>` + txt(xi, Math.min(yi + 16, 196), '像', 'r');
          else note = txt(334, 30, '像在很远处 →', 'r', 'end');
        } else {
          const e1 = ext(X, ty, X + f * k, Y, 340), e2 = ext(x0, ty, X, Y, 340);
          rays = ray(x0, ty, X, ty, '#ff9f1a') + ray(X, ty, e1[0], e1[1], '#ff9f1a') + ray(x0, ty, e2[0], e2[1], '#00a37a')
            + `<line x1="${X}" y1="${ty}" x2="${xi}" y2="${yi}" stroke="#ff9f1a" stroke-width="1.6" stroke-dasharray="4 4"/>`
            + `<line x1="${x0}" y1="${ty}" x2="${xi}" y2="${yi}" stroke="#00a37a" stroke-width="1.6" stroke-dasharray="4 4"/>`;
          if (xi > 2) img = `<line x1="${xi}" y1="${Y}" x2="${xi}" y2="${yi}" stroke="#e8505b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#ahR)"/>` + txt(xi, Math.max(yi - 6, 12), '虚像', 'r');
          else note = txt(8, 30, '← 虚像在很远处', 'r', 'start');
        }
      }
      const mark = (x, l) => `<line x1="${x}" y1="${Y - 4}" x2="${x}" y2="${Y + 4}" stroke="#2d3047" stroke-width="2"/>` + txt(x, Y + 17, l, 'm');
      return `<svg viewBox="0 0 340 200" class="sim-svg">${arrowDefs}
        <rect width="340" height="200" fill="#fbfdff"/>
        <line x1="0" y1="${Y}" x2="340" y2="${Y}" stroke="#9aa3bf" stroke-width="1.5"/>
        ${mark(X - 2 * f * k, '2F')}${mark(X - f * k, 'F')}${mark(X + f * k, 'F')}${mark(X + 2 * f * k, '2F')}
        <ellipse cx="${X}" cy="${Y}" rx="9" ry="70" fill="rgba(120,190,255,.35)" stroke="#2f7cf6" stroke-width="2"/>
        ${txt(X, 196, '凸透镜', 'bl')}
        ${rays}
        <line x1="${x0}" y1="${Y}" x2="${x0}" y2="${ty}" stroke="#2d3047" stroke-width="4" marker-end="url(#ah)"/>
        <text x="${x0}" y="${ty - 8}" text-anchor="middle" font-size="16">🕯️</text>
        ${img}${note}
      </svg>`;
    },
    read(s) {
      const im = lensImg(s.u);
      return [['物距 u', s.u + ' cm', ''], ['像距 v', im.none ? '—' : im.real ? f1(im.v) + ' cm' : '同侧 ' + f1(-im.v) + ' cm', 'r'], ['像', im.kind, 'bl']];
    },
    tip(s) {
      const im = lensImg(s.u);
      const zone = s.u > 20 ? 'u > 2f' : s.u === 20 ? 'u = 2f' : s.u > 10 ? 'f < u < 2f' : s.u === 10 ? 'u = f' : 'u < f';
      return `<b>${zone}</b>：${im.kind}　应用：${im.use}。<br><small>口诀：一倍焦距分虚实，二倍焦距分大小；成实像时物近像远像变大。</small>`;
    },
    tasks: [
      { t: '像<b>照相机</b>那样：调出倒立、<b>缩小</b>的实像', hint: '物体要放在二倍焦距（20 cm）以外', check: s => s.u > 20 },
      { t: '像<b>投影仪</b>那样：调出倒立、<b>放大</b>的实像', hint: '物距在一倍和二倍焦距之间', check: s => s.u > 10 && s.u < 20 },
      { t: '调出倒立、<b>等大</b>的实像', hint: '此时 u = v = 2f', check: s => s.u === 20 },
      { t: '像<b>放大镜</b>那样：调出正立、放大的<b>虚像</b>', hint: '物体放在一倍焦距以内', check: s => s.u < 10 },
    ],
  };

  /* =========================================================
   * 3. 杠杆平衡
   * ========================================================= */
  const HOOK = 0.5;
  const lever = {
    id: 'lever', emoji: '⚖️', name: '杠杆平衡', ch: 'machine', cls: 't2',
    desc: '挂钩码让杠杆水平平衡：F₁L₁ = F₂L₂',
    init: () => ({ lc: 2, lp: 3, rc: 1, rp: 1 }),
    ctrls: [
      { type: 'step', key: 'rc', label: '右侧钩码个数', min: 1, max: 6, fmt: v => v + ' 个' },
      { type: 'step', key: 'rp', label: '右侧挂在第几格', min: 1, max: 5, fmt: v => '第 ' + v + ' 格' },
    ],
    draw(s) {
      const cx = 160, cy = 78, g = 27, tl = s.lc * s.lp, tr = s.rc * s.rp;
      const deg = clamp((tr - tl) * 2.2, -14, 14), a = deg * D2R;
      const pt = d => [cx + d * g * Math.cos(a), cy + d * g * Math.sin(a)];
      const beamEnd1 = pt(-5.6), beamEnd2 = pt(5.6);
      let ticks = '';
      for (let d = -5; d <= 5; d++) { if (!d) continue; const [x, y] = pt(d); ticks += `<circle cx="${x}" cy="${y}" r="2.6" fill="#fff" stroke="#8a6d3b"/>` + `<text x="${x}" y="${y - 7}" class="st m" text-anchor="middle">${Math.abs(d)}</text>`; }
      const stack = (d, n, col) => {
        const [x, y] = pt(d); let s2 = `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + 16}" stroke="#555" stroke-width="1.5"/>`;
        for (let k = 0; k < n; k++) s2 += `<rect x="${x - 9}" y="${y + 16 + k * 15}" width="18" height="13" rx="3" fill="${col}" stroke="#555"/>`;
        return s2;
      };
      const bal = tl === tr;
      return `<svg viewBox="0 0 320 200" class="sim-svg">
        <rect width="320" height="200" fill="#fffdf6"/>
        <path d="M${cx - 18},190 L${cx},${cy + 4} L${cx + 18},190 Z" fill="#c9b68f" stroke="#8a6d3b" stroke-width="2"/>
        <line x1="${beamEnd1[0]}" y1="${beamEnd1[1]}" x2="${beamEnd2[0]}" y2="${beamEnd2[1]}" stroke="#d9a75f" stroke-width="10" stroke-linecap="round"/>
        ${ticks}
        <circle cx="${cx}" cy="${cy}" r="5" fill="#2d3047"/>
        ${stack(-s.lp, s.lc, '#7b8cff')}${stack(s.rp, s.rc, '#ff9f43')}
        ${txt(cx, 22, bal ? '⚖️ 水平平衡！' : tl > tr ? '⬅ 左边下沉' : '右边下沉 ➡', bal ? 'ok b' : 'r b')}
      </svg>`;
    },
    read(s) {
      const L = (s.lc * HOOK) * s.lp, R = (s.rc * HOOK) * s.rp;
      return [['左 F₁×L₁', `${f1(s.lc * HOOK)}N×${s.lp}格=${f1(L)}`, 'bl'], ['右 F₂×L₂', `${f1(s.rc * HOOK)}N×${s.rp}格=${f1(R)}`, 'o'], ['结果', L === R ? '✅ 相等' : L > R ? '左 > 右' : '左 < 右', L === R ? 'ok' : 'r']];
    },
    tip: () => '每个钩码重 0.5 N。杠杆平衡条件：<b>动力 × 动力臂 = 阻力 × 阻力臂</b>（F₁L₁ = F₂L₂）。',
    tasks: [
      { t: '左边 2 个钩码挂在第 3 格，在右边挂钩码，让杠杆<b>水平平衡</b>', hint: '2 × 3 = 右边个数 × 格数', setup: s => Object.assign(s, { lc: 2, lp: 3, rc: 1, rp: 1 }), check: s => s.lc * s.lp === s.rc * s.rp },
      { t: '左边 4 个钩码挂在第 2 格，右边只用 <b>2 个</b>钩码让它平衡', hint: '4 × 2 = 2 × ?', setup: s => Object.assign(s, { lc: 4, lp: 2, rc: 1, rp: 1 }), check: s => s.rc === 2 && s.lc * s.lp === s.rc * s.rp },
      { t: '左边 3 个钩码在第 4 格，右边挂在 <b>第 2 格</b>，需要几个钩码？', hint: '3 × 4 = ? × 2', setup: s => Object.assign(s, { lc: 3, lp: 4, rc: 1, rp: 1 }), check: s => s.rp === 2 && s.lc * s.lp === s.rc * s.rp },
    ],
  };

  /* =========================================================
   * 4. 浮力与浮沉
   * ========================================================= */
  const LIQ = { alc: { r: 8, name: '酒精', fill: '#f4f0d0' }, water: { r: 10, name: '水', fill: '#bfe3ff' }, salt: { r: 12, name: '盐水', fill: '#c8d8f0' } };
  const buoyCalc = s => {
    const ro = s.rho / 10, rl = LIQ[s.liq].r / 10, G = ro;           // V = 100 cm³，g = 10 N/kg → G = ρ(g/cm³) N
    if (s.rho < LIQ[s.liq].r) return { ro, rl, G, F: G, Vp: 100 * ro / rl, state: '漂浮', N: 0 };
    if (s.rho === LIQ[s.liq].r) return { ro, rl, G, F: G, Vp: 100, state: '悬浮', N: 0 };
    return { ro, rl, G, F: rl, Vp: 100, state: '下沉（沉底）', N: G - rl };
  };
  const buoy = {
    id: 'buoy', emoji: '🚢', name: '浮力与浮沉', ch: 'buoy', cls: 't6',
    desc: '改变物块密度和液体，看漂浮、悬浮、下沉',
    init: () => ({ rho: 5, liq: 'water' }),
    ctrls: [
      { type: 'range', key: 'rho', label: '物块密度 ρ物', min: 1, max: 30, step: 1, fmt: v => (v / 10).toFixed(1) + ' g/cm³' },
      { type: 'seg', key: 'liq', label: '液体', opts: [['alc', '酒精 0.8'], ['water', '水 1.0'], ['salt', '盐水 1.2']] },
    ],
    draw(s) {
      const c = buoyCalc(s), top = 78, bot = 200, side = 52;
      let y;
      if (c.state === '漂浮') y = top - side + side * c.ro / c.rl;
      else if (c.state === '悬浮') y = 118;
      else y = bot - side - 2;
      const x = 150 - side / 2, mid = y + side / 2;
      const shade = Math.round(clamp(230 - s.rho * 6, 60, 230));
      const col = `rgb(${shade + 20},${Math.round(shade * .8)},${Math.round(shade * .55)})`;
      const lenG = clamp(30 + c.G * 14, 30, 80), lenF = c.F ? clamp(30 + c.F * 14, 30, 80) : 0;
      return `<svg viewBox="0 0 300 214" class="sim-svg">${arrowDefs}
        <rect width="300" height="214" fill="#fbfdff"/>
        <rect x="62" y="${top}" width="176" height="${bot - top}" fill="${LIQ[s.liq].fill}"/>
        <path d="M60,30 L60,202 L240,202 L240,30" fill="none" stroke="#7a8bb0" stroke-width="3"/>
        <line x1="62" y1="${top}" x2="238" y2="${top}" stroke="#5b8cc9" stroke-width="1.5" stroke-dasharray="5 4"/>
        ${txt(232, top + 16, LIQ[s.liq].name, 'm', 'end')}
        <rect x="${x}" y="${y}" width="${side}" height="${side}" rx="4" fill="${col}" stroke="#5a4630" stroke-width="2"/>
        <line x1="${150 + 6}" y1="${mid}" x2="${150 + 6}" y2="${mid + lenG}" stroke="#e8505b" stroke-width="3" marker-end="url(#ahR)"/>
        ${txt(150 + 12, mid + lenG - 2, 'G = ' + f2(c.G) + ' N', 'r b', 'start')}
        ${c.F ? `<line x1="${150 - 6}" y1="${mid}" x2="${150 - 6}" y2="${mid - lenF}" stroke="#00a37a" stroke-width="3" marker-end="url(#ahG)"/>${txt(150 - 12, mid - lenF + 10, 'F浮 = ' + f2(c.F) + ' N', 'ok b', 'end')}` : ''}
        ${txt(150, 20, c.state === '漂浮' ? '🛟 漂浮：F浮 = G' : c.state === '悬浮' ? '🫧 悬浮：F浮 = G' : '⬇ 沉底：F浮 < G', c.state === '下沉（沉底）' ? 'r b' : 'ok b')}
      </svg>`;
    },
    read(s) {
      const c = buoyCalc(s);
      return [['重力 G', f2(c.G) + ' N', 'r'], ['浮力 F浮', f2(c.F) + ' N', 'ok'], ['V排', Math.round(c.Vp) + ' cm³', 'bl']];
    },
    tip(s) {
      const c = buoyCalc(s);
      return `物块体积 100 cm³。ρ物 ${c.ro.toFixed(1)} ${c.ro < c.rl ? '<' : c.ro === c.rl ? '=' : '>'} ρ液 ${c.rl.toFixed(1)} → <b>${c.state}</b>。F浮 = ρ液gV排 = ${c.rl.toFixed(1)}×10³ kg/m³ × 10 N/kg × ${Math.round(c.Vp)}×10⁻⁶ m³ = ${f2(c.F)} N${c.N ? `，容器底支持力 ${f2(c.N)} N` : ''}。`;
    },
    tasks: [
      { t: '让物块在<b>水</b>中<b>悬浮</b>', hint: '悬浮时 ρ物 = ρ液', check: s => s.liq === 'water' && s.rho === 10 },
      { t: '在<b>盐水</b>中让物块漂浮，并且<b>一半</b>露出液面', hint: 'V排 / V物 = ρ物 / ρ液 = 1/2', check: s => s.liq === 'salt' && s.rho === 6 },
      { t: '让物块在<b>酒精</b>中沉底，看看浮力是多少', hint: 'ρ物 > 0.8 g/cm³ 就会下沉', check: s => s.liq === 'alc' && s.rho > 8 },
    ],
  };

  /* =========================================================
   * 5. 欧姆定律电路
   * ========================================================= */
  const ohmCalc = s => { const I = s.U / (s.R + s.P); return { I, UR: I * s.R, UP: I * s.P }; };
  const ohm = {
    id: 'ohm', emoji: '⚡', name: '欧姆定律电路', ch: 'ohm', cls: 't4',
    desc: '调电源、电阻和滑动变阻器，读电流表、电压表',
    init: () => ({ U: 3, R: 10, P: 10 }),
    ctrls: [
      { type: 'seg', key: 'U', label: '电源电压', opts: [[1.5, '1.5 V'], [3, '3 V'], [4.5, '4.5 V'], [6, '6 V']] },
      { type: 'seg', key: 'R', label: '定值电阻 R', opts: [[5, '5 Ω'], [10, '10 Ω'], [15, '15 Ω'], [20, '20 Ω']] },
      { type: 'range', key: 'P', label: '变阻器接入 R滑', min: 0, max: 20, step: 1, fmt: v => v + ' Ω' },
    ],
    draw(s) {
      const c = ohmCalc(s), dur = clamp(0.5 / c.I, 0.35, 8).toFixed(2), cells = Math.round(s.U / 1.5);
      const sx = 220 - s.P / 20 * 100;  // 滑片位置：接入的是滑片右边那段电阻丝
      let bat = '';
      for (let k = 0; k < cells; k++) { const y = 82 + k * 12; bat += `<line x1="26" y1="${y}" x2="54" y2="${y}" stroke="#2d3047" stroke-width="2.5"/><line x1="33" y1="${y + 5}" x2="47" y2="${y + 5}" stroke="#2d3047" stroke-width="5"/>`; }
      const by2 = 82 + cells * 12;
      return `<svg viewBox="0 0 340 214" class="sim-svg">${arrowDefs}
        <rect width="340" height="214" fill="#fbfdff"/>
        <g fill="none" stroke="#2d3047" stroke-width="2.5">
          <path d="M40,82 L40,36 L142,36"/><path d="M178,36 L280,36 L280,74"/><path d="M280,138 L280,176 L220,176"/><path d="M110,150 L110,176 L40,176 L40,${by2}"/>
          <path d="M280,56 L318,56 L318,88"/><path d="M318,124 L318,158 L280,158"/>
        </g>
        <path d="M40,82 L40,36 L280,36 L280,176 L220,176 M${sx},164 L${sx},150 L110,150 L110,176 L40,176 L40,${by2}" fill="none" stroke="#ffb400" stroke-width="3.5" stroke-dasharray="3 13" class="flow" style="animation-duration:${dur}s" stroke-linecap="round" opacity=".9"/>
        ${bat}
        ${txt(14, 96, '+', 'r b')}${txt(62, by2 + 2, '电源', 'm', 'start')}
        <circle cx="160" cy="36" r="17" fill="#fff" stroke="#2d3047" stroke-width="2.5"/>${txt(160, 42, 'A', 'b big')}
        <rect x="270" y="74" width="20" height="64" fill="#fff" stroke="#2d3047" stroke-width="2.5"/>${txt(258, 110, 'R', 'b', 'end')}
        <circle cx="318" cy="106" r="17" fill="#fff" stroke="#2d3047" stroke-width="2.5"/>${txt(318, 112, 'V', 'b big')}
        <rect x="120" y="168" width="100" height="16" fill="#fff" stroke="#2d3047" stroke-width="2.5"/>
        <path d="M120,176 ${Array.from({ length: 10 }, (_, k) => `L${125 + k * 10},170 L${130 + k * 10},182`).join(' ')} L220,176" fill="none" stroke="#b07a3c" stroke-width="1.4"/>
        <path d="M110,150 L${sx},150 L${sx},164" fill="none" stroke="#2f7cf6" stroke-width="2.5" marker-end="url(#ahB)"/>
        <rect x="${sx - 5}" y="${144}" width="10" height="8" rx="2" fill="#2f7cf6"/>
        ${txt(170, 204, '滑动变阻器（滑片右边一段接入）', 'm')}
        <path d="M70,36 L100,36" stroke="#e8505b" stroke-width="2" marker-end="url(#ahR)"/>${txt(86, 28, 'I', 'r b')}
      </svg>`;
    },
    read(s) {
      const c = ohmCalc(s);
      return [['电流表 I', f2(c.I) + ' A', 'r'], ['电压表 U_R', f2(c.UR) + ' V', 'bl'], ['变阻器 U滑', f2(c.UP) + ' V', 'o']];
    },
    tip(s) {
      const c = ohmCalc(s);
      return `串联：I = U / (R + R滑) = ${s.U} V ÷ (${s.R} Ω + ${s.P} Ω) = <b>${f2(c.I)} A</b>；U_R = IR = ${f2(c.UR)} V。<br><small>黄点表示电流方向（电源外部从正极流向负极），流得越快电流越大。</small>`;
    },
    tasks: [
      { t: '电源 <b>3 V</b>、R = <b>10 Ω</b>，调变阻器让电流表示数为 <b>0.20 A</b>', hint: '总电阻 R总 = U / I = 15 Ω', check: s => s.U === 3 && s.R === 10 && s.P === 5 },
      { t: '电源 <b>6 V</b>，让电压表（R 两端）示数为 <b>3.00 V</b>', hint: '串联分压：U_R : U滑 = R : R滑', check: s => s.U === 6 && s.P === s.R },
      { t: '让电流表示数达到最大值 <b>1.20 A</b>', hint: '电压最大、总电阻最小', check: s => s.U === 6 && s.R === 5 && s.P === 0 },
    ],
  };

  const SIMS = [light, lens, lever, buoy, ohm];
  const BY = Object.fromEntries(SIMS.map(s => [s.id, s]));
  let prog = store.get('wl_sim', {});   // id -> 已完成任务数组 [true,...]
  const doneN = id => (prog[id] || []).filter(Boolean).length;
  const totalTasks = SIMS.reduce((a, s) => a + s.tasks.length, 0);

  /* ---------- 菜单 ---------- */
  function openLab() {
    C.stopAll(); C.setView('lab'); C.setBrand('🔬 物理实验室');
    $('#labMenu').innerHTML = SIMS.map(s => {
      const d = doneN(s.id), n = s.tasks.length;
      return `<button class="game-tile ${s.cls}" data-sim="${s.id}"><div class="gt-emoji">${s.emoji}</div><div class="gt-body"><div class="gt-name">${s.name}</div><div class="gt-desc">${s.desc}</div></div><div class="gt-best">${d === n ? '🏅 ' : ''}${d}/${n}</div></button>`;
    }).join('');
    C.show('scrLab');
  }
  $('#labMenu').addEventListener('click', e => { const t = e.target.closest('[data-sim]'); if (t) { SFX.tap(); openSim(t.dataset.sim, 'lab'); } });

  /* ---------- 模拟页 ---------- */
  let cur = null, st = null, from = 'lab', ti = 0, armed = false, celebrating = false;
  function openSim(id, src) {
    C.stopAll(); $('#modal').hidden = true;
    cur = BY[id]; from = src || 'lab'; st = cur.init(); armed = false; celebrating = false;
    C.setView('sim'); C.setBrand(cur.emoji + ' ' + cur.name);
    ti = firstTodo();
    if (ti < cur.tasks.length && cur.tasks[ti].setup) cur.tasks[ti].setup(st);
    buildCtrls(); update(); C.show('scrSim');
  }
  const firstTodo = () => { const p = prog[cur.id] || []; let i = 0; while (i < cur.tasks.length && p[i]) i++; return i; };
  function buildCtrls() {
    $('#simCtrl').innerHTML = cur.ctrls.map(c => {
      if (c.type === 'range') return `<div class="sc-row"><div class="sc-l">${c.label}<b data-out="${c.key}"></b></div><input type="range" data-k="${c.key}" min="${c.min}" max="${c.max}" step="${c.step}"></div>`;
      if (c.type === 'seg') return `<div class="sc-row"><div class="sc-l">${c.label}</div><div class="seg" data-seg="${c.key}">${c.opts.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('')}</div></div>`;
      return `<div class="sc-row step"><div class="sc-l">${c.label}</div><div class="stepper"><button data-st="${c.key}" data-d="-1">−</button><b data-out="${c.key}"></b><button data-st="${c.key}" data-d="1">＋</button></div></div>`;
    }).join('');
  }
  function syncCtrls() {
    cur.ctrls.forEach(c => {
      const out = $(`[data-out="${c.key}"]`, $('#simCtrl')); if (out) out.textContent = c.fmt(st[c.key]);
      const r = $(`input[data-k="${c.key}"]`); if (r && +r.value !== st[c.key]) r.value = st[c.key];
      $$(`[data-seg="${c.key}"] button`).forEach(b => b.classList.toggle('on', String(st[c.key]) === b.dataset.v));
    });
  }
  function change(key, v) { if (st[key] === v) return; st[key] = v; armed = true; update(); }
  $('#simCtrl').addEventListener('input', e => { const r = e.target.closest('input[data-k]'); if (r) change(r.dataset.k, +r.value); });
  $('#simCtrl').addEventListener('click', e => {
    const sb = e.target.closest('.seg button');
    if (sb) { SFX.tap(); const key = sb.parentNode.dataset.seg, c = cur.ctrls.find(x => x.key === key); const v = c.opts.find(o => String(o[0]) === sb.dataset.v)[0]; return change(key, v); }
    const pb = e.target.closest('[data-st]');
    if (pb) { SFX.tap(); const c = cur.ctrls.find(x => x.key === pb.dataset.st); change(c.key, clamp(st[c.key] + +pb.dataset.d, c.min, c.max)); }
  });
  function update() {
    syncCtrls();
    $('#simStage').innerHTML = cur.draw(st);
    $('#simRead').innerHTML = cur.read(st).map(([k, v, c]) => `<div class="sr ${c}"><span>${k}</span><b>${v}</b></div>`).join('');
    $('#simTips').innerHTML = '💡 ' + cur.tip(st);
    drawTask();
    if (armed && !celebrating && ti < cur.tasks.length && cur.tasks[ti].check(st, cur)) complete();
  }
  function drawTask(justDone) {
    const n = cur.tasks.length, p = prog[cur.id] || [];
    const dots = cur.tasks.map((_, k) => `<span class="td${p[k] ? ' on' : ''}${k === ti && !justDone ? ' cur' : ''}"></span>`).join('');
    let body;
    if (justDone) body = `<div class="tk-t okc">✅ 任务完成！${justDone}</div>`;
    else if (ti >= n) body = `<div class="tk-t">🏅 全部任务完成！可以自由探究，或 <button class="btn mini" id="simReset">重做任务</button></div>`;
    else body = `<div class="tk-t">🎯 任务 ${ti + 1}/${n}：${cur.tasks[ti].t}</div><details class="tk-h"><summary>💭 提示</summary>${cur.tasks[ti].hint}</details>`;
    $('#simTask').innerHTML = `<div class="tk-dots">${dots}</div>${body}`;
    const rs = $('#simReset'); if (rs) rs.onclick = () => { prog[cur.id] = []; store.set('wl_sim', prog); ti = 0; armed = false; if (cur.tasks[0].setup) { cur.tasks[0].setup(st); } update(); };
  }
  function complete() {
    celebrating = true;
    const p = prog[cur.id] || []; p[ti] = true; prog[cur.id] = p; store.set('wl_sim', prog);
    C.record(true);
    SFX.clear();
    const all = doneN(cur.id) === cur.tasks.length;
    drawTask(all ? '这个实验的徽章到手 🏅' : '');
    $('#simTask').classList.remove('pop'); void $('#simTask').offsetWidth; $('#simTask').classList.add('pop');
    toast(all ? '🏅 实验全部完成！' : '✅ 任务完成！');
    setTimeout(() => {
      if (!cur) return;
      celebrating = false; armed = false;
      ti = firstTodo();
      if (ti < cur.tasks.length && cur.tasks[ti].setup) cur.tasks[ti].setup(st);
      update();
    }, 1400);
  }
  function simBack() { const f = from; cur = null; if (f.startsWith('chapter:')) W.openChapter(f.slice(8)); else openLab(); }

  W.openLab = openLab; W.openSim = openSim; W.simBack = simBack;
  W.labSummary = () => { const d = SIMS.reduce((a, s) => a + doneN(s.id), 0); return d ? `🏅 ${d}/${totalTasks}` : ''; };
  W.sim = { SIMS, debug: () => ({ id: cur && cur.id, st, ti, celebrating, armed }), set: change };
  C.refreshMenu();
})();
</script>
</body>
</html>
